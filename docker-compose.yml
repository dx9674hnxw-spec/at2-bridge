services:
  at2-bridge:
    build: .
    container_name: at2-bridge
    restart: unless-stopped

    # BLE via BlueZ/D-Bus needs the host's Bluetooth stack: network_mode
    # host is the simplest reliable way to reach it (no port mapping
    # needed then -- the app listens directly on the host's :2910).
    #
    # Putting this behind a reverse proxy (Traefik) or a Cloudflare
    # Tunnel? Host networking means Traefik's Docker-label routing can't
    # auto-discover this container -- see the "Behind Traefik + a
    # Cloudflare Tunnel" section in the README for the two supported
    # approaches (a Traefik file-provider snippet, or the
    # docker-compose.traefik.yml override if you don't need server-side
    # BLE).
    network_mode: host

    # privileged simplifies USB/BLE device access; if you want to avoid
    # it, replace with explicit `devices:` entries for your serial
    # adapter (e.g. /dev/ttyACM0) and a `cap_add: [NET_ADMIN, NET_RAW]`
    # + D-Bus socket mount for Bluetooth.
    privileged: true

    volumes:
      - /var/run/dbus:/var/run/dbus
      - /dev:/dev
      - at2-bridge-data:/srv/data

    environment:
      - PYTHONUNBUFFERED=1
      #- AT2_BRIDGE_PASSWORD=0000 # Default password can be disabled with #

volumes:
  at2-bridge-data:
